name: Recess
description: >-
  Recess (Recess Academy, recess.gg) is an online school for gifted and
  neurodivergent students, including learners with ADHD, dyslexia, autism
  spectrum, and anxiety. It combines core academics, interest-led classes,
  small-group coworking sessions with an AI tutor, and a daily community hour,
  with personalized pacing and world-class mentors. Recess is backed by
  Bloomberg Beta. As of this enrichment pass the company operates a consumer
  education web application and publishes no public API, developer portal, SDKs,
  or OpenAPI surface; the only machine-discoverable surface found is a valid
  RFC 9116 security.txt with a security contact.
